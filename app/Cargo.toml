[package]
name = "fractal-branch"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "FractalBranch"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-core = "0.62"
windows-numerics = "0.3"
windows = { version = "0.62.2", features = [
  "Win32_Foundation", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_Graphics_Gdi", "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_DirectComposition", "Win32_Graphics_Imaging",
  "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole",
  "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Registry",
  "Win32_System_Memory", "Win32_System_SystemServices", "Win32_System_DataExchange", "Win32_System_SystemInformation",
] }

[build-dependencies]
embed-manifest = "1.5.1"
